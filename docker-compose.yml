# AyKa Platform - Docker Compose for Production
# Usage: docker compose up -d

services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    container_name: ayka-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - apps/api/.env.production
    volumes:
      - ./apps/api/public/uploads:/app/apps/api/public/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.dashboard
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.ayka.site}
    container_name: ayka-dashboard
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.ayka.site}
      - PORT=3001
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
