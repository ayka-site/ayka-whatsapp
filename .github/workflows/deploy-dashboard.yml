name: Deploy AyKa Dashboard

on:
  push:
    branches: [spv-ai-receptionist-v2]
    paths:
      - 'apps/dashboard/**'
      - 'packages/shared/**'
      - 'infra/docker/Dockerfile.dashboard'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

env:
  REGISTRY: aykaacr3c24cc61.azurecr.io
  IMAGE_NAME: ayka-dashboard

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: aykaacr3c24cc61.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.dashboard
          push: true
          tags: aykaacr3c24cc61.azurecr.io/ayka-dashboard:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://aykabot.ayka.site

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Container Apps
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            if ! az containerapp show --name ayka-dashboard --resource-group ayka-rg &>/dev/null; then
              echo "Creating container app ayka-dashboard..."
              az containerapp create \
                --name ayka-dashboard \
                --resource-group ayka-rg \
                --environment ayka-env \
                --image aykaacr3c24cc61.azurecr.io/ayka-dashboard:${{ github.sha }} \
                --registry-server aykaacr3c24cc61.azurecr.io \
                --registry-username ${{ secrets.REGISTRY_USERNAME }} \
                --registry-password ${{ secrets.REGISTRY_PASSWORD }} \
                --target-port 3001 \
                --ingress external \
                --min-replicas 0 \
                --max-replicas 2 \
                --cpu 0.5 \
                --memory 1Gi \
                --env-vars \
                  NODE_ENV=production \
                  PORT=3001
            else
              echo "Updating existing container app..."
              az containerapp registry set \
                --name ayka-dashboard \
                --resource-group ayka-rg \
                --server aykaacr3c24cc61.azurecr.io \
                --username ${{ secrets.REGISTRY_USERNAME }} \
                --password ${{ secrets.REGISTRY_PASSWORD }}

              az containerapp update \
                --name ayka-dashboard \
                --resource-group ayka-rg \
                --image aykaacr3c24cc61.azurecr.io/ayka-dashboard:${{ github.sha }}
            fi
