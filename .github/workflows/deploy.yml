name: Deploy AyKa API

on:
  push:
    branches: [spv-ai-receptionist-v2]
    paths:
      - 'apps/api/**'
      - 'apps/widget/**'
      - 'packages/db/**'
      - 'infra/docker/Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: aykaacr3c24cc61.azurecr.io
  IMAGE_NAME: ayka-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: aykaacr3c24cc61.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: aykaacr3c24cc61.azurecr.io/ayka-api:${{ github.sha }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Container Apps
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp registry set \
              --name ayka-api \
              --resource-group ayka-rg \
              --server aykaacr3c24cc61.azurecr.io \
              --username ${{ secrets.REGISTRY_USERNAME }} \
              --password ${{ secrets.REGISTRY_PASSWORD }}

            az containerapp update \
              --name ayka-api \
              --resource-group ayka-rg \
              --image aykaacr3c24cc61.azurecr.io/ayka-api:${{ github.sha }} \
              --min-replicas 1 \
              --max-replicas 2 \
              --cpu 0.5 \
              --memory 1Gi \
              --set-env-vars \
                API_PUBLIC_URL=https://aykabot.ayka.site \
                PUBLIC_API_URL=https://aykabot.ayka.site \
                WHATSAPP_MEDIA_BASE_URL=https://aykabot.ayka.site \
                ALLOWED_ORIGINS=https://bot.ayka.site,https://aykabot.ayka.site
