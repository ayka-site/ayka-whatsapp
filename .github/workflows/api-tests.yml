name: API Tests

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'infra/docker/Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/api-tests.yml'
  push:
    branches:
      - spv-ai-receptionist-v2
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'infra/docker/Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/api-tests.yml'

jobs:
  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm test --workspace @ayka/api

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
